function formatUbuntuResponse(text) {
  const lines = text.split(/\r?\n/);
  let html = "";
  let paragraph = [];

  function flushParagraph() {
    if (!paragraph.length) return;

    const content = paragraph.join(" ").trim();

    if (content) {
      html += `<p>${content}</p>`;
    }

    paragraph = [];
  }

  lines.forEach(line => {
    const t = line.trim()
  .replace(/^\\>\s?/, "")
  .replace(/^\\---\s*$/, "");
    if (!t) {
      flushParagraph();
      return;
    }

    if (/^#{1,3}\s*(MuchiShona|Shona)$/i.test(t)) {
      flushParagraph();
      html += `<div class="language-heading shona-heading"><span>Shona</span></div>`;
      return;
    }

    if (/^#{1,3}\s*(In English|English)$/i.test(t)) {
      flushParagraph();
      html += `<div class="language-heading english-heading"><span>English</span></div>`;
      return;
    }

    if (/^#{1,6}\s+/.test(t)) {
      flushParagraph();

      const heading = t
        .replace(/^#{1,6}\s+/, "")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

      html += `<h3>${heading}</h3>`;
      return;
    }

    if (/^[-*]\s+/.test(t)) {
      flushParagraph();

      const bullet = t
        .replace(/^[-*]\s+/, "")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

      html += `<div class="ubuntu-bullet">• ${bullet}</div>`;
      return;
    }

    if (/^\d+\.\s+/.test(t)) {
      flushParagraph();

      const number = t.match(/^\d+\./)[0];
      const content = t
        .replace(/^\d+\.\s+/, "")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

      html += `
        <div class="ubuntu-numbered">
          <span class="number">${number}</span>
          <span>${content}</span>
        </div>
      `;
      return;
    }

    paragraph.push(
      t.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    );
  });

  flushParagraph();

  return html;
}

async function playUbuntuSpeech(text) {

  if (playUbuntuSpeech.isPlaying) {
    return;
  }

  playUbuntuSpeech.isPlaying = true;

  try {

    const maxLength = 4000;
    const chunks = [];
    let remaining = text.trim();

    while (remaining.length > maxLength) {

      let cut = remaining.lastIndexOf(".", maxLength);

      if (cut < maxLength * 0.5) {
        cut = remaining.lastIndexOf(" ", maxLength);
      }

      if (cut <= 0) {
        cut = maxLength;
      }

      chunks.push(
        remaining.slice(0, cut + 1).trim()
      );

      remaining = remaining.slice(cut + 1).trim();
    }

    if (remaining) {
      chunks.push(remaining);
    }

    for (const chunk of chunks) {

      console.log("TTS CHUNK LENGTH:", chunk.length);

      const speakRes = await fetch(
        "https://ubuntu-ai-founder-notebook-production.up.railway.app/speak",
        {
          method: "POST",
          headers: {
  "Content-Type": "application/json",
  "Authorization": "Bearer " + localStorage.getItem("authToken")
},
          body: JSON.stringify({
            text: chunk
          })
        }
      );

      if (!speakRes.ok) {
        throw new Error("Speech request failed.");
      }

      const audioBlob = await speakRes.blob();
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);

      await new Promise((resolve, reject) => {
        audio.onended = resolve;
        audio.onerror = reject;
        audio.play();
      });

      URL.revokeObjectURL(audioUrl);
    }

  } finally {

    playUbuntuSpeech.isPlaying = false;

  }
}

signupButton.onclick = async function () {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    authMessage.textContent = "Please enter your email and password.";
    return;
  }

  try {
    const response = await fetch("https://ubuntu-ai-founder-notebook-production.up.railway.app/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + localStorage.getItem("authToken")
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      authMessage.textContent =
        data.error || "Could not create account.";
      return;
    }

    authMessage.textContent = data.message;

  } catch (error) {
    console.error("SIGNUP ERROR:", error);
    authMessage.textContent =
      "Could not connect to the server.";
  }
};

    button.onclick = async function () {
      const message = input.value.trim();

      if (!message) {
        return;
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user-message";
      userMessage.textContent = message;

      conversation.appendChild(userMessage);

      input.value = "";

      conversation.scrollTop = conversation.scrollHeight;

      const conversationId =
  localStorage.getItem("ubuntuConversationId") ||
  crypto.randomUUID();

localStorage.setItem(
  "ubuntuConversationId",
  conversationId
);

      try {
        const result = await fetch("https://ubuntu-ai-founder-notebook-production.up.railway.app/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
             "Authorization": "Bearer " + localStorage.getItem("authToken")
          },
          body: JSON.stringify({
  message: message,
  conversationId: conversationId
})
        });

        const data = await result.json();

        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai-message";
        aiMessage.innerHTML = formatUbuntuResponse(data.reply);
        const speechText = aiMessage.innerText;

        const playBtn = document.createElement("button");
        playBtn.className = "play-btn";
        playBtn.textContent = "🔊 Play";

       playBtn.onclick = async () => {
  try {
    await playUbuntuSpeech(speechText);
  } catch (error) {
    console.error("TTS ERROR:", error);
  }
};

        aiMessage.appendChild(
          document.createTextNode(" ")
        );

        aiMessage.appendChild(playBtn);

        conversation.appendChild(aiMessage);

        conversation.scrollTop = conversation.scrollHeight;

        loadConversations();

      } catch (error) {
        console.error("CHAT ERROR:", error);

        const errorMessage = document.createElement("div");
        errorMessage.className = "message ai-message";
        errorMessage.textContent =
          "Ndine urombo, Ubuntu Voice haakwanise kubatana neAI parizvino.";

        conversation.appendChild(errorMessage);
      }
    };

    micButton.onclick = async () => {
      console.log("🎤 Speak button clicked");

      try {
        console.log("Requesting microphone...");

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        console.log("✅ Microphone granted!", stream);

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: "audio/webm;codecs=opus"
        });

        audioChunks = [];

        micButton.textContent = "🔴 Recording...";
        micButton.classList.add("recording");

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          console.log("Recording stopped");

          micButton.textContent = "🎤 Speak";
          micButton.classList.remove("recording");

          stream.getTracks().forEach(track => {
            track.stop();
          });

          const audioBlob = new Blob(audioChunks, {
            type: "audio/webm"
          });

          const formData = new FormData();

          formData.append("file", audioBlob);

          console.log("Sending to transcribe...");

          try {
            const res = await fetch(
  "https://ubuntu-ai-founder-notebook-production.up.railway.app/transcribe",
  {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + localStorage.getItem("authToken")
    },
    body: formData
  }
);

            const data = await res.json();

            console.log("Transcription result:", data);

            if (data.text) {
              input.value = data.text;

              button.click();
            } else {
              console.log(
                "⚠️ No text returned from transcription"
              );
            }

          } catch (error) {
            console.error(
              "TRANSCRIPTION ERROR:",
              error
            );
          }
        };

        mediaRecorder.start();

        console.log(
          "Recording started — will stop in 5s"
        );

        setTimeout(() => {
          if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
          ) {
            mediaRecorder.stop();
          }
        }, 5000);

      } catch (err) {

        console.error(
          "❌ MIC ERROR:",
          err.name,
          err.message
        );

        alert(
          "Microphone error: " +
          err.message +
          "\n\nPlease allow microphone access!"
        );

        micButton.textContent = "🎤 Speak";
        micButton.classList.remove("recording");
      }
    };

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        button.click();
      }
    });
  </script>
